name: cloudhelm-p0
services:
  postgres:
    image: postgres:16.13@sha256:5d143123fdf80462d1778cd4f24b9f7ca13c87174bca19141fb194c5a1ebca59
    environment:
      POSTGRES_DB: cloudhelm_p0
      POSTGRES_USER: cloudhelm_probe
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudhelm_probe -d cloudhelm_p0"]
      interval: 2s
      timeout: 2s
      retries: 20
    mem_limit: 256m
    cpus: 1.0
    tmpfs:
      - /var/lib/postgresql/data
