# Fixed local artifact-verification contract. This template does not enable a
# general Compose parser or remote deployment; image identities come from BuildRun.
# A separate bounded migration container uses the backend image and the
# reference_owner credential to run `alembic upgrade 0002_add_updated_at_index`.
# The ordinary backend receives only the reference_app non-superuser credential.
# The trusted local verifier supplies a bounded loopback entrance to the exact
# frontend IP. The internal network has no Docker-published service ports.
name: cloudhelm-reference-artifact-verification
services:
  postgres:
    image: ${POSTGRES_IMAGE_ID}
    user: "1000:1000"
    read_only: true
    environment:
      POSTGRES_DB: reference_notes
      POSTGRES_USER: reference_owner
      POSTGRES_PASSWORD_FILE: /run/cloudhelm-secrets/owner
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    command: [postgres, -c, max_connections=30, -c, shared_buffers=32MB, -c, log_min_messages=panic, -c, log_statement=none]
    volumes:
      - reference_data:/var/lib/postgresql/data
      - ephemeral_database_credentials:/run/cloudhelm-secrets:ro
    tmpfs: [/tmp:size=16777216, /var/run/postgresql:size=4194304]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    shm_size: 64m
    ipc: private
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: {driver: none}
    networks: [verification]
  backend:
    image: ${BACKEND_IMAGE_ID}
    user: "0:0"
    read_only: true
    environment:
      DATABASE_URL: ${EPHEMERAL_APPLICATION_DATABASE_URL}
      PYTHONDONTWRITEBYTECODE: "1"
    dns_opt: ["timeout:1", "attempts:1"]
    tmpfs: [/tmp:size=16777216]
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 128
    shm_size: 1m
    ipc: private
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: {driver: none}
    networks: [verification]
  frontend:
    image: ${FRONTEND_IMAGE_ID}
    user: "0:0"
    read_only: true
    expose: ["80"]
    tmpfs: [/tmp:size=8388608, /var/cache/nginx:size=16777216, /var/run:size=1048576]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    shm_size: 1m
    ipc: private
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN]
    security_opt: [no-new-privileges:true]
    logging: {driver: none}
    networks: [verification]
networks:
  verification:
    internal: true
volumes:
  reference_data:
  ephemeral_database_credentials:
