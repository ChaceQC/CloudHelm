name: 仓库验证

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 检查仓库结构、文本编码与入库范围
        run: |
          python3 -X utf8 - <<'PY'
          import pathlib
          import subprocess

          required = (
              "AGENTS.md",
              "README.md",
              "PROJECT_PLAN.md",
              "PROJECT_PROGRESS.md",
              "pyproject.toml",
              "uv.lock",
              ".python-version",
              ".gitignore",
              ".gitattributes",
              "云舵 CloudHelm 毕设设计书 v4.7.md",
              "docs/design/README.md",
              "docs/design/06-implementation-validation.md",
              "docs/GitHub协作与合并流程.md",
          )
          missing = [name for name in required if not pathlib.Path(name).is_file()]
          if missing:
              raise SystemExit("缺少必需文件：" + ", ".join(missing))

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode("utf-8").split("\0")
          text_suffixes = {".md", ".yml", ".yaml", ".json", ".toml", ".lock", ".svg", ".drawio", ".py", ".ts", ".tsx", ".js", ".jsx", ".rs"}
          env_templates = {".env.example", ".env.sample", ".env.template", ".env.schema"}
          forbidden_parts = {".thesis-work", ".venv", "node_modules", "__pycache__"}
          for name in filter(None, tracked):
              path = pathlib.Path(name)
              if forbidden_parts.intersection(path.parts):
                  raise SystemExit("不允许入库的目录：" + name)
              if (path.name == ".env" or path.name.startswith(".env.")) and path.name not in env_templates:
                  raise SystemExit("不允许入库的环境配置：" + name)
              if path.suffix.lower() in {".key", ".pem", ".p12", ".pfx"}:
                  raise SystemExit("不允许入库的密钥文件：" + name)
              if path.suffix.lower() in text_suffixes or path.name in {".gitignore", ".gitattributes"}:
                  path.read_text(encoding="utf-8-sig")

          subprocess.run(["git", "check-ignore", "--quiet", ".thesis-work/ignore-check"], check=True)
          print("仓库结构、UTF-8 文本及 .thesis-work 忽略规则检查通过。")
          PY

      - name: 安装已锁定的 Hub 与接缝依赖
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.29"
          enable-cache: true

      - name: 检查 Hub、P0 与参照源码和契约
        run: |
          uv sync --locked
          uv run --frozen python - <<'PY'
          import ast
          import json
          import pathlib
          from packages.contracts.p0.runtime_contracts import P0RuntimeContracts

          for directory in ("database", "modules", "services", "packages/contracts", "scripts/p1", "scripts/p0", "examples/standalone-project/backend/app", "examples/standalone-project/backend/migrations", "docs/acceptance/reference/r1"):
              for path in pathlib.Path(directory).rglob("*.py"):
                  ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          schema = P0RuntimeContracts.model_json_schema()
          assert {"RuntimeInput", "TurnResult", "AcceptedReceipt"}.issubset(schema["$defs"])
          for path in pathlib.Path("packages/contracts/p0").glob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
          import sys
          sys.path.insert(0, "examples/standalone-project/backend")
          from app.main import create_app
          frozen_api = json.loads(pathlib.Path("examples/standalone-project/backend/openapi.json").read_text(encoding="utf-8"))
          assert create_app(None).openapi() == frozen_api
          print("Hub/P0/参照源码语法、锁定依赖、契约导入与参照OpenAPI一致性检查通过；本步骤未运行模型、数据库或容器实验。")
          PY

      - name: 核对 P0.3 决定契约
        run: uv run --frozen python -m scripts.p0.check_decisions

      - name: 核对 Hub HTTP 契约快照
        run: uv run --frozen python -m scripts.p1.check_public_contracts

      - name: 核对 Git 文件视图与 OCI 内容边界
        run: |
          uv run --frozen python -m scripts.p1.check_workspace_git
          uv run --frozen python -m scripts.p1.check_artifact_content

      - name: 检查参照后端依赖锁
        run: uv lock --check --directory examples/standalone-project/backend

      - name: 安装参照构建用 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: examples/standalone-project/frontend/package-lock.json

      - name: 构建参照前端
        working-directory: examples/standalone-project/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: 检查提交差异格式
        run: git show --format= --check HEAD -- . ':!docs/archive/**'
