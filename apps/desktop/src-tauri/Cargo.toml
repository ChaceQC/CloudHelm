[package]
name = "cloudhelm-desktop"
version = "0.29.0"
description = "CloudHelm 基础工程工作台"
edition = "2021"
rust-version = "1.97"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
keyring = { version = "3.6", features = ["windows-native"] }
rfd = "0.15"
rusqlite = { version = "0.37", features = ["bundled"] }
percent-encoding = "2"
tokio = { version = "1", features = ["time", "rt"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
wry = { version = "=0.57.1", default-features = false }

[features]
custom-protocol = ["tauri/custom-protocol"]
